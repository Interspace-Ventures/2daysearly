name: Managed standards

on:
  pull_request:
  push:
    branches: [staging, release, main]

jobs:
  validate:
    uses: Interspace-Ventures/Structured/.github/workflows/managed-repository.yml@aafd51cb5b7014f8cfc42dd46c73a9becff7bfbe
    with:
      node-version: "22"
      package-manager: npm
      install-command: "npm ci"
      typecheck-command: "npm run check"
      build-command: "npm run build"
