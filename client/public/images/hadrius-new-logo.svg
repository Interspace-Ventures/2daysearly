<svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Geometric cube icon -->
  <g transform="translate(2, 8)">
    <!-- Front face -->
    <polygon points="12,4 20,8 20,16 12,20 4,16 4,8" fill="none" stroke="#000" stroke-width="2"/>
    <!-- Back face -->
    <polygon points="8,0 16,4 16,12 8,16 0,12 0,4" fill="none" stroke="#000" stroke-width="2"/>
    <!-- Connecting lines -->
    <line x1="0" y1="4" x2="4" y2="8" stroke="#000" stroke-width="2"/>
    <line x1="8" y1="0" x2="12" y2="4" stroke="#000" stroke-width="2"/>
    <line x1="16" y1="4" x2="20" y2="8" stroke="#000" stroke-width="2"/>
    <line x1="16" y1="12" x2="20" y2="16" stroke="#000" stroke-width="2"/>
    <line x1="8" y1="16" x2="12" y2="20" stroke="#000" stroke-width="2"/>
    <line x1="0" y1="12" x2="4" y2="16" stroke="#000" stroke-width="2"/>
  </g>
  
  <!-- Text "Hadrius" -->
  <text x="28" y="26" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#000">Hadrius</text>
</svg>