<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fizz logo simplified in black and white -->
  <g>
    <!-- "F" -->
    <rect x="20" y="20" width="6" height="40" fill="black"/>
    <rect x="20" y="20" width="20" height="6" fill="black"/>
    <rect x="20" y="35" width="15" height="6" fill="black"/>
    
    <!-- "i" -->
    <rect x="50" y="25" width="6" height="35" fill="black"/>
    <circle cx="53" cy="18" r="3" fill="black"/>
    
    <!-- "z" -->
    <rect x="65" y="35" width="18" height="6" fill="black"/>
    <rect x="65" y="54" width="18" height="6" fill="black"/>
    <polygon points="65,41 77,41 71,48 83,48 83,54 71,54 77,47 65,47" fill="black"/>
    
    <!-- "z" -->
    <rect x="90" y="35" width="18" height="6" fill="black"/>
    <rect x="90" y="54" width="18" height="6" fill="black"/>
    <polygon points="90,41 102,41 96,48 108,48 108,54 96,54 102,47 90,47" fill="black"/>
    
    <!-- Credit card symbol -->
    <rect x="125" y="25" width="50" height="30" rx="5" fill="none" stroke="black" stroke-width="3"/>
    <rect x="130" y="35" width="40" height="4" fill="black"/>
    <rect x="130" y="43" width="15" height="2" fill="black"/>
    <rect x="130" y="47" width="20" height="2" fill="black"/>
  </g>
</svg>