    <line x1="104" y1="50" x2="126" y2="50" stroke="black" stroke-width="2"/>
    <line x1="74" y1="52" x2="83" y2="63" stroke="black" stroke-width="2"/>
    <line x1="96" y1="52" x2="87" y2="63" stroke="black" stroke-width="2"/>
