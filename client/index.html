<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="2 days early - Investment syndicate by operators, for operators" />
    <title>2 Days Early</title>
    <link rel="icon" type="image/png" href="/images/2-days-early-calendar-icon-2025.png" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Tally configuration for manual loading only -->
    <script>
      window.TallyConfig = {
        hideTitle: true,
        formId: 'nP1v8e',
        autoOpen: false
      };
      
      // Load Tally script manually when needed
      window.loadTally = function() {
        if (!window.Tally && !document.querySelector('script[src*="tally.so"]')) {
          const script = document.createElement('script');
          script.src = 'https://tally.so/widgets/embed.js';
          script.async = true;
          script.onload = function() {
            window.dispatchEvent(new Event('tally-loaded'));
          };
          document.head.appendChild(script);
        }
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
